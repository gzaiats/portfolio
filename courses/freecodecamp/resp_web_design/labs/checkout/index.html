<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <section>
      <h2>Your Cart</h2>
      <img src='https://cdn.freecodecamp.org/curriculum/labs/cube.jpg' alt='3 by 3 Magic Cube'>
    </section>
    <section>
      <h2>Payment Information</h2>
      <form>
        <label for='card-name'>Name on card:
            <span aria-hidden='true'>*</span>
            <input id='card-name' name='card-name' type='text' required aria-describedby='card-name-help'>
        </label>
            <p id='card-name-help'>Name entered should be exactly as printed on card.</p>
        <label for='card-number'>Card number:
            <span aria-hidden='true'>*</span>
            <input id='card-number' name='card-number' type='text' required aria-describedby='card-number-help'>
        </label>
            <p id='card-number-help' >The card number should follow the order printed on your card.</p>
        <label for='card-date'>Card number:
            <span aria-hidden='true'>*</span>
            <input id='card-date' name='card-date' type='text' required aria-describedby='card-date-help'>
        </label>
            <p id='card-date-help'>Date should be entered in the MM/YY format.</p>
            <button id='submit'>Submit</button>
      </form>
    </section>
  </body>
</html>

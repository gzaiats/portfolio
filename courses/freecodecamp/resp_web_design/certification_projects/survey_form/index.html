<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
  <body>
    <h1 id="title">Double Diamond Ranch Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve our service.</p>
    <form id="survey-form">
      <label for="name" id="name-label">Name:</label>
      <input id="name" type="text" required placeholder="Jane Doe">
      <br>
      <label for="email" id="email-label">Email:</label>
      <input id="email" type="email" required placeholder="janedoe@email.com">
      <br>
      <label for="number" id="number-label">Phone number:</label>
      <input id="number" type="number" min=11 max=11 placeholder="11123456789">
      <br><br>
      <label for="dropdown">May we contact you regarding your answers?</label>
      <br><br>
      <select id="dropdown">
        <option id="yes" selected>Yes, I will be glad to help.</option>
        <option id="no">No, please do not contact me.</option>
      </select><br><br>
      <p>How would you rate our service?</p>
      <input type="radio" name="radio" value="5"><label for="5">★★★★★</label><br>
      <input type="radio" name="radio" value="4"><label for="4">★★★★☆</label><br>
      <input type="radio" name="radio" value="3"><label for="3">★★★☆☆</label><br>
      <input type="radio" name="radio" value="2"><label for="2">★★☆☆☆</label><br>
      <input type="radio" name="radio" value="1"><label for="1">★☆☆☆☆</label>
      <br><br>
      <p>What can we improve on?</p> 
      <input type="checkbox"  name="checkbox" value="service"><label for="service">Service</label><br>
      <input type="checkbox"  name="checkbox" value="food"><label for="food">Food</label><br>
      <input type="checkbox"  name="checkbox" value="facilities"><label for="facilities">Facilities</label><br>
      <input type="checkbox"  name="checkbox" value="staff"><label for="staff">Staff</label><br>
      <input type="checkbox"  name="checkbox" value="other"><label for="other">Other (please explain below)</label>
      <p>Please detail your selection(s):</p>
      <textarea rows=5 cols=35></textarea>
      <p>Any additional comments?</p>
      <textarea rows=5 cols=35></textarea>
      <br><br>
      <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>

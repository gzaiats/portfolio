<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css"
  </head>
  <body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="1">
            <label for="1">Finish freeCodeCamp's Responsive Web Design Certification Course</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/learn/responsive-web-design-v9/" target="_blank" class="sub-item-link">Responsive Web Design Course</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="2">
            <label for="2">Start (and finish) freeCodeCamp's JavaScript Certification Course</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/learn/javascript-v9/" target="_blank" class="sub-item-link">JavaScript Course</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="3">
            <label for="3">Learn Java</label>
            <ul class="sub-item">
                <li><a href="https://www.codedex.io/java" target="_blank" class="sub-item-link">Java Course</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="4">
            <label for="4">Learn C# and get Microsoft's certification</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/learn/foundational-c-sharp-with-microsoft/" target="_blank" class="sub-item-link">C# Course</a></li>
            </ul>
        </li>
    </ul>
  </body>
</html>
